<style>

:root{
--bg:#F7F7F8;--card:#FFFFFF;--text:#222222;--muted:#6B7280;--line:#E5E7EB;
--accent:#9370DB;--accent-dark:#7E5FC6;--rose:#F1EDFB;--brown:#52525B;--brown-dark:#3F3F46;
--shadow:0 1px 4px rgba(0,0,0,.035);--radius:4px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.01em}
body.modal-open{overflow:hidden}
a{color:inherit;text-decoration:none}
.top-link-row{width:min(720px,calc(100% - 40px));max-width:720px;margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back-to-main{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;background:var(--brown);color:#fff;border:1px solid var(--brown);border-radius:9px;font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.045)}
.back-to-main:hover{background:var(--brown-dark);border-color:var(--brown-dark)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.blank-top-btn{display:inline-flex;align-items:center;justify-content:center;width:86px;min-height:36px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;color:transparent;pointer-events:none;cursor:default;box-shadow:0 1px 5px rgba(0,0,0,.035)}
.top-menu-btn{display:inline-flex;align-items:center;justify-content:center;width:86px;min-height:36px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;color:var(--brown);cursor:pointer;font-weight:700;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.035)}
.top-menu-btn:hover{background:#F4F4F5;border-color:#CDC3BF}
.blank-top-btn.small{width:48px;border-radius:999px}.heart-top-btn{display:inline-flex;align-items:center;justify-content:center;width:86px;min-height:36px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;color:var(--brown);cursor:pointer;font-weight:700;font-size:16px;box-shadow:0 1px 5px rgba(0,0,0,.035)}.heart-top-btn:hover{background:#F4F4F5;border-color:#CDC3BF}.heart-top-btn.small{width:48px;border-radius:999px;padding:0}
.page{width:min(720px,calc(100% - 40px));max-width:720px;margin:0 auto;padding:14px 0 56px}
header{margin-bottom:12px}.title{margin:0 0 6px;font-size:clamp(24px,5vw,34px);letter-spacing:-.04em}.desc{margin:0;color:var(--muted);font-size:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:10px}
.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:10px}
 .recent-searches{grid-column:1/-1;position:relative;margin-top:-4px}
.recent-searches[hidden]{display:none!important}
.recent-searches-box{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#F7F7F8}
.recent-searches-label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
#recentSearchList{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.recent-search-chip{width:auto;min-height:30px;padding:0 9px;background:#fff;color:var(--brown);border:1px solid #D9DCE1;border-radius:4px;font-size:12px;font-weight:600}
.recent-search-chip:hover{background:#F2F0FA;color:#6E619D}
.recent-search-clear{width:auto;min-height:30px;padding:0 8px;margin-left:auto;background:transparent;color:var(--muted);border:0;font-size:12px;font-weight:600}
.recent-search-clear:hover{color:var(--brown);background:#fff}
.recent-search-item{display:inline-flex;align-items:center;flex:0 0 auto;border:1px solid #D9DCE1;border-radius:4px;background:#fff;overflow:hidden}
.recent-search-item .recent-search-chip{border:0;border-radius:0;background:#fff;min-height:30px;padding:0 8px}
.recent-search-remove{width:28px!important;min-width:28px!important;min-height:30px!important;height:30px!important;padding:0!important;border:0!important;border-left:1px solid #E5E7EB!important;border-radius:0!important;background:#fff!important;color:var(--muted)!important;font-size:15px!important;line-height:1!important}
.recent-search-remove:hover{background:#F2F0FA!important;color:var(--brown)!important}
@media(max-width:980px){
  .recent-searches-box{flex-wrap:nowrap!important;overflow:hidden!important}
  .recent-searches-label{flex:0 0 auto}
  #recentSearchList{display:flex!important;align-items:center!important;gap:6px!important;flex-wrap:nowrap!important;min-width:0!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #recentSearchList::-webkit-scrollbar{display:none}
  .recent-search-clear{flex:0 0 auto;margin-left:0!important}
}

.quick-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.detail-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.detail-toggle-btn{display:none}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,button{width:100%;min-height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;padding:0 12px}
input:focus,select:focus,button:focus{outline:none;border-color:#9370DB;box-shadow:0 0 0 3px rgba(183,132,143,.16)}
button{cursor:pointer;font-weight:700;background:var(--accent);color:#fff;border-color:var(--accent);white-space:nowrap}
button.secondary{background:#fff;color:var(--brown);border-color:#D9DCE1}
button.ghost{background:#F2F0FA;color:#6E619D;border-color:#E5E7EB}
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 8px;color:var(--muted);font-size:14px}.summary strong{color:var(--text);font-size:18px}
.active-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;text-align:right}
.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid #E5E7EB;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:16px;align-items:center}.card-info{min-width:0;padding-right:0}
.book-title{display:block;margin:0 0 7px;color:#27272A;font-size:17px;font-weight:700;line-height:1.35;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.book-title:hover{color:var(--accent-dark);text-decoration:underline;text-underline-offset:3px}.book-title.no-link:hover{text-decoration:none;color:#222222}
.book-meta{margin:0;color:#52525B;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-middle{position:static;transform:none;width:max-content;max-width:260px;text-align:center;pointer-events:auto;justify-self:center}.book-history-inline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap}.history-pill{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 12px;border-radius:999px;background:#F2F0FA;border:1px solid #E5E7EB;color:#7B68B6;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.02em}.history-pill.recent{background:#F4F4F5;border-color:#E5E7EB;color:#52525B}
.card-actions{display:grid;grid-template-columns:1fr;gap:9px;width:96px;min-width:96px;justify-self:start}
.history-btn,.move-btn{width:96px;min-height:40px;border-radius:12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-align:center}
.history-btn{background:var(--brown);border-color:var(--brown);color:#fff}.history-btn:hover{background:var(--brown-dark);border-color:var(--brown-dark)}.history-btn.disabled{opacity:.45;cursor:not-allowed;filter:none;pointer-events:none}
.move-btn{background:#fff;color:var(--brown);border:1px solid #D9DCE1}.move-btn:hover{background:#F4F4F5}
.empty,.error{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}.empty.prompt{min-height:280px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#6B7280;background:transparent;border:1px dashed var(--line);box-shadow:none}.error{color:#9b3b35}.hidden{display:none!important}.load-more-wrap{margin-top:18px;display:flex;justify-content:center}.load-more-wrap button{width:min(280px,100%);min-height:46px}
.float-nav{position:fixed;right:16px;bottom:18px;z-index:25;display:grid;gap:8px}.float-nav button{width:44px;height:44px;min-height:44px;border-radius:999px;padding:0;box-shadow:0 8px 20px rgba(0,0,0,.12);background:#fff;color:var(--brown);border-color:var(--line);font-size:18px}
.history-modal-backdrop,.date-index-backdrop,.taste-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:80;padding:18px;align-items:center;justify-content:center}.history-modal-backdrop.open,.date-index-backdrop.open,.taste-modal-backdrop.open{display:flex}.history-modal,.date-index-modal,.taste-modal{width:min(460px,100%);max-height:82vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.14);padding:20px}.date-index-modal{width:min(560px,100%)}.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.history-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.45;color:#222222}.history-close{width:34px!important;min-height:34px!important;padding:0!important;border-radius:999px!important;background:#F3EEEE!important;color:var(--brown)!important;border:1px solid #E5E7EB!important;flex:0 0 auto}.history-meta{margin:0 0 15px;color:#3F3F46;font-size:13px;font-weight:600;line-height:1.45}.history-list{display:grid;gap:9px}.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #E5E7EB;background:#F7F7F8;border-radius:13px;padding:11px 12px}.history-date{font-weight:700;color:#3F3F46;font-size:15px}.history-rate{font-weight:700;color:#fff;background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:5px 12px;min-width:58px;text-align:center;box-shadow:0 2px 8px rgba(169,120,130,.18)}.history-empty{padding:18px 12px;text-align:center;color:var(--muted);border:1px dashed #E5E7EB;border-radius:13px;background:#F7F7F8}.date-index-desc{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:700}.date-index-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:8px}.date-chip{min-height:40px;border-radius:999px;background:#F7F7F8;color:var(--brown);border:1px solid #E5E7EB;font-size:13px;font-weight:700}.date-chip:hover{background:#F2F0FA}.date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.clear-date-btn{width:auto!important;min-height:34px!important;padding:0 12px!important;background:#fff!important;color:var(--brown)!important;border-color:#D9DCE1!important;border-radius:999px!important;font-size:12px!important}

.taste-card-list{display:grid;gap:10px;margin-top:12px}
.taste-card{background:#F7F7F8;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.taste-card-title{margin:0 0 5px;color:#222222;font-size:15px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.taste-card-desc{margin:0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.5}
@media(max-width:980px){.top-link-row,.page{width:min(100% - 24px,720px)}.top-link-row{margin-top:12px}.blank-top-btn,.top-menu-btn,.heart-top-btn{width:62px;min-height:34px}.blank-top-btn.small,.heart-top-btn.small{width:38px}.search-row,.detail-row{grid-template-columns:1fr}.quick-row{grid-template-columns:minmax(120px,1fr) auto auto;gap:8px}.quick-row>div:nth-child(2){width:72px}.detail-toggle-btn{display:block;width:42px;min-height:44px;border-radius:14px;padding:0;font-size:18px;line-height:1}.detail-row.mobile-collapsed{display:none}.summary{align-items:flex-start;flex-direction:column}.active-summary{text-align:left;white-space:normal}.card{grid-template-columns:1fr;gap:12px;padding:16px}.card-info{padding-right:0}.book-title{white-space:normal;font-size:16px}.book-meta{white-space:normal}.card-middle{width:auto;max-width:none;text-align:left;justify-self:start}.book-history-inline{justify-content:flex-start;flex-wrap:wrap}.card-actions{grid-template-columns:1fr 1fr;width:100%;min-width:0}.history-btn,.move-btn{width:100%}.float-nav button{width:40px;height:40px;min-height:40px}}

@media (max-width:980px){
.detail-toggle-btn{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.detail-toggle-icon{
  width:14px;
  height:14px;
  border-right:4px solid currentColor;
  border-bottom:4px solid currentColor;
  transform:rotate(45deg) translateY(-2px);
  border-radius:2px;
  display:inline-block;
}
.detail-toggle-btn:not(.is-collapsed) .detail-toggle-icon{
  transform:rotate(225deg) translateY(-2px);
}
}


.card{position:relative}
.book-cover{display:none}.favorite-toggle{display:none}.view-mode-row{display:none}.install-banner{display:none}.mobile-tabbar{display:none}
@media(max-width:980px){
  .top-link-row{display:none}.page{padding-bottom:112px}header{margin:14px 0 10px}.title{font-size:25px;letter-spacing:-.04em}.desc{display:none}
  .install-banner{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:10px 11px;margin:0 0 10px;color:#52525B;font-size:12px;font-weight:600;line-height:1.35}.install-banner.hidden{display:none!important}.install-banner span{min-width:0;flex:1}.install-banner button{width:auto;min-height:30px;border-radius:999px;padding:0 10px;font-size:12px;background:#fff;color:var(--brown);border-color:#D9DCE1}.install-banner button#installDismissBtn{width:30px;padding:0;font-size:16px}

<script id="recent-viewed-works-script">
(function(){
  const KEY='dm_recent_viewed_works_v1';
  const LIMIT=30;
  const norm=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,'');
  const cleanHref=v=>{try{const u=new URL(String(v||''),location.href);return (u.origin+u.pathname).replace(/\/$/,'')}catch{return String(v||'').split('?')[0].replace(/\/$/,'')}};
  function identity(item){
    const ta=norm(item?.title)+'|'+norm(item?.author);
    if(ta!=='|')return 'ta:'+ta;
    const href=cleanHref(item?.href);if(href)return 'href:'+href;
    const wid=norm(item?.workId);if(wid)return 'id:'+wid;
    return 'key:'+norm(item?.key);
  }
  function dedupe(raw){
    const arr=Array.isArray(raw)?raw:[];const seen=new Set();const out=[];
    for(const item of arr){if(!item||typeof item!=='object')continue;const id=identity(item);if(!id||seen.has(id))continue;seen.add(id);out.push(item);if(out.length>=LIMIT)break}
    return out;
  }
  const getItems=()=>{try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');const d=dedupe(v);if(JSON.stringify(d)!==JSON.stringify(v))localStorage.setItem(KEY,JSON.stringify(d));return d}catch{return []}};
  const saveItems=v=>{try{localStorage.setItem(KEY,JSON.stringify(dedupe(v).slice(0,LIMIT)))}catch{}};
  function rememberFromCard(card,linkEl){
    if(!card)return;
    const title=String(card.querySelector('.book-title')?.textContent||'').trim();
    const author=String(card.querySelector('.book-meta')?.textContent||'').trim();
    const href=String(linkEl?.href||card.querySelector('.book-title[href]')?.href||card.querySelector('.book-cover[href]')?.href||'').trim();
    const workId=String(card.dataset.workId||'').trim();
    if(!title)return;
    const fresh={key:workId||href||(title+'|'+author),workId,title,author,href,seenAt:Date.now()};
    const fid=identity(fresh);const items=getItems().filter(x=>identity(x)!==fid);items.unshift(fresh);saveItems(items);
  }
  function render(){
    const list=document.getElementById('recentViewedList');if(!list)return;
    list.innerHTML='';const items=getItems();
    if(!items.length){const empty=document.createElement('div');empty.className='recent-viewed-empty';empty.textContent='최근 본 작품이 없습니다.';list.appendChild(empty);return}
    items.forEach(item=>{const el=document.createElement(item.href?'a':'div');el.className='recent-viewed-item';if(item.href){el.href=item.href;el.target='_blank';el.rel='noopener noreferrer'}const title=document.createElement('span');title.className='recent-viewed-title';title.textContent=item.title||'(제목 없음)';const author=document.createElement('span');author.className='recent-viewed-author';author.textContent=item.author||'작가 정보 없음';el.append(title,author);list.appendChild(el)});
  }
  function open(){const b=document.getElementById('recentViewedBackdrop');if(!b)return;render();b.classList.add('open');b.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
  function close(){const b=document.getElementById('recentViewedBackdrop');if(!b)return;b.classList.remove('open');b.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
  getItems();
  document.addEventListener('click',function(e){
    const link=e.target.closest?.('.book-title[href],.book-cover[href]');if(link)rememberFromCard(link.closest('.card'),link);
    const action=e.target.closest?.('.history-btn,.favorite-toggle,.favorite-action-btn,.cart-btn');if(action&&!action.disabled&&!action.classList.contains('disabled'))rememberFromCard(action.closest('.card'),null);
    const remove=e.target.closest?.('.remove-btn[data-remove-id]');if(remove){const row=remove.closest?.('.cart-item');if(row){const title=String(row.querySelector('.cart-item-title')?.textContent||'').trim();const meta=String(row.querySelector('.cart-item-meta')?.textContent||'').trim();const author=meta.split('·')[0].trim();const rawKey=String(remove.getAttribute('data-remove-id')||'').trim();if(title){const href=/^https?:\/\//i.test(rawKey)?rawKey:'';const workId=href?'':rawKey;const fresh={key:rawKey||(title+'|'+author),workId,title,author,href,seenAt:Date.now()};const fid=identity(fresh);const items=getItems().filter(x=>identity(x)!==fid);items.unshift(fresh);saveItems(items)}}}
    const trigger=e.target.closest?.('[data-open-recent-viewed]');if(trigger){e.preventDefault();const menu=document.getElementById('mobileMenuBackdrop');if(menu){menu.classList.remove('open');menu.setAttribute('aria-hidden','true')}open()}
  },true);
  document.getElementById('recentViewedClose')?.addEventListener('click',close);
  document.getElementById('recentViewedBackdrop')?.addEventListener('click',e=>{if(e.target.id==='recentViewedBackdrop')close()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
<script>
(function(){
  function send(name, params){ try{ if(window.gtag) window.gtag('event', name, Object.assign({page_title:document.title,page_location:location.href}, params||{})); }catch(e){} }
  function cardMeta(el){ const c=el&&el.closest&&el.closest('.card'); return {title:c?.querySelector?.('.book-title')?.textContent?.trim()||'',author:c?.querySelector?.('.book-meta')?.textContent?.trim()||''}; }
  document.addEventListener('click',function(e){
    const el=e.target.closest&&e.target.closest('button,a'); if(!el)return; const id=el.id||'';
    if(id==='searchBtn') send('search_used',{query:document.getElementById('q')?.value||'',page:'event'});
    if(id==='keywordFindBtn') send('search_used',{scope:'keyword',query:document.getElementById('keywordQuery')?.value||'',page:'event'});
    if(el.matches('.history-btn:not(.disabled)')) send('history_open',Object.assign(cardMeta(el),{page:'event'}));
    if(id==='tabSearchBtn') send('search_tab_open',{page:'event'});
    if(id==='tabFavBtn'||id==='tasteTopBtn') send('wish_open',{source:id||'top',page:'event'});
    if(id==='tabCartBtn'||id==='pcCartCollapseBtn') send('cart_open',{source:id||'pc',page:'event'});
    if(id==='viewCardBtn'||id==='viewListBtn') send('view_mode_click',{mode:id==='viewCardBtn'?'card':'list',page:'event'});
    if(id==='loadMoreBtn') send('load_more_click',{page:'event'});
    if(el.matches('.book-title[href]')) send('book_click',Object.assign(cardMeta(el),{link_url:el.href||'',page:'event'}));
    if(el.matches('.master-back-btn,.event-mobile-master-btn')) send('master_back_click',{page:'event'});
    if(el.matches('.event-recent-mobile-btn,.pc-recent-viewed-box')) send('recent_viewed_open',{page:'event'});
  },true);
  document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target?.id==='q') send('search_used',{query:e.target.value||'',method:'enter',page:'event'}); },true);
  document.addEventListener('change',function(e){
    const el=e.target;
    if(el?.id==='discountRate'||el?.id==='favDiscountRate') send('filter_discount',{value:el.value||'all',scope:el.id,page:'event'});
    else if(el?.id==='sortBy') send('filter_sort',{value:el.value||'default',page:'event'});
    else if(el?.id==='pricePreset'||el?.id==='favPricePreset') send('filter_price',{value:el.value||'all',scope:el.id,page:'event'});
    else if(el?.id==='typeFilter') send('filter_type',{value:el.value||'all',page:'event'});
    else if(['titleOnly','authorOnly','exclude'].includes(el?.id)) send('filter_change',{filter:el.id,value:el.value||'',page:'event'});
    else if(el?.id==='favListSelect') send('wish_list_change',{value:el.value||'',page:'event'});
  },true);
})();
</script>
