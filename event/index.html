<style>

:root{
--bg:#F7F7F8;--card:#FFFFFF;--text:#222222;--muted:#6B7280;--line:#E5E7EB;

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:-.01em}

.top-menu-btn{display:inline-flex;align-items:center;justify-content:center;width:86px;min-height:36px;border:1px solid #E5E7EB;border-radius:9px;background:#fff;color:var(--brown);cursor:pointer;font-weight:700;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.035)}
.top-menu-btn:hover{background:#F4F4F5;border-color:#CDC3BF}

.page{width:min(720px,calc(100% - 40px));max-width:720px;margin:0 auto;padding:14px 0 56px}

.detail-toggle-btn{display:none}

.summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 8px;color:var(--muted);font-size:14px}.summary strong{color:var(--text);font-size:18px}

.list{display:grid;gap:10px}.card{background:var(--card);border:1px solid #E5E7EB;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:16px;align-items:center}.card-info{min-width:0;padding-right:0}

.book-meta{margin:0;color:#52525B;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-middle{position:static;transform:none;width:max-content;max-width:260px;text-align:center;pointer-events:auto;justify-self:center}.book-history-inline{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:nowrap}.history-pill{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 12px;border-radius:999px;background:#F2F0FA;border:1px solid #E5E7EB;color:#7B68B6;font-size:13px;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.02em}.history-pill.recent{background:#F4F4F5;border-color:#E5E7EB;color:#52525B}
.card-actions{display:grid;grid-template-columns:1fr;gap:9px;width:96px;min-width:96px;justify-self:start}
.history-btn,.move-btn{width:96px;min-height:40px;border-radius:12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 10px;text-align:center}
.history-btn{background:var(--brown);border-color:var(--brown);color:#fff}.history-btn:hover{background:var(--brown-dark);border-color:var(--brown-dark)}.history-btn.disabled{opacity:.45;cursor:not-allowed;filter:none;pointer-events:none}
.move-btn{background:#fff;color:var(--brown);border:1px solid #D9DCE1}.move-btn:hover{background:#F4F4F5}
.empty,.error{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--muted)}.empty.prompt{min-height:280px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#6B7280;background:transparent;border:1px dashed var(--line);box-shadow:none}.error{color:#9b3b35}.hidden{display:none!important}.load-more-wrap{margin-top:18px;display:flex;justify-content:center}.load-more-wrap button{width:min(280px,100%);min-height:46px}

te-chip:hover{background:#F2F0FA}.date-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.clear-date-btn{width:auto!important;min-height:34px!important;padding:0 12px!important;background:#fff!important;color:var(--brown)!important;border-color:#D9DCE1!important;border-radius:999px!important;font-size:12px!important}

.taste-card-list{display:grid;gap:10px;margin-top:12px}
.taste-card{background:#F7F7F8;border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(0,0,0,.035)}
.taste-card-title{margin:0 0 5px;color:#222222;font-size:15px;font-weight:700;letter-spacing:-.03em;line-height:1.35}
.taste-card-desc{margin:0;color:var(--muted);font-size:13px;font-weight:700;line-height:1.5}
