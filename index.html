 class="date-list-view hidden" aria-label="출현연월 목록"><div class="date-list-head"><strong>출현연월 목록</strong><select id="dateYearFilter" aria-label="연도별 보기"><option value="">전체 연도</option></select></div><div id="dateListInline" class="date-list-inline"></div></section><section id="list" class="list" aria-label="작품 목록"></section><div id="empty" class="empty prompt hidden">검색값을 입력하세요</div><div id="error" class="error hidden"></div><div id="loadMoreWrap" class="load-more-wrap hidden"><button id="loadMoreBtn" type="button">더보기</button></div><div id="bottomAnchor"></div></main><div id="historyModalBackdrop" class="history-modal-backdrop" aria-hidden="true"><section class="history-modal" role="dialog" aria-modal="true" aria-labelledby="historyModalTitle"><div class="history-head"><h2 id="historyModalTitle">과거 할인율</h2><button id="historyModalClose" class="history-close" type="button" aria-label="닫기">×</button></div><p id="historyModalMeta" class="history-meta"></p><div id="historyModalBody" class="history-list"></div></section></div><div id="dateIndexBackdrop" class="date-index-backdrop" aria-hidden="true"><section class="date-index-modal" role="dialog" aria-modal="true" aria-labelledby="dateIndexTitle"><div class="history-head"><h2 id="dateIndexTitle">정리된 출현연월</h2><button id="dateIndexClose" class="history-close" type="button" aria-label="닫기">×</button></div><p class="date-index-desc">누락에 주의하세요</p><div id="dateIndexBody" class="date-index-list"></div></section></div><div id="tasteModalBackdrop" class="taste-modal-backdrop" aria-hidden="true"><section class="taste-modal" role="dialog" aria-modal="true" aria-labelledby="tasteModalTitle"><div class="history-head"><h2 id="tasteModalTitle">찐토리 취향</h2><button id="tasteModalClose" class="history-close" type="button" aria-label="닫기">×</button></div><p class="history-meta">냠💚</p><div class="taste-card-list"><article class="taste-card"><h3 class="taste-card-title">취향작 카드 1</h3><p class="taste-card-desc">준비중</p></article></div></section></div><nav class="mobile-tabbar" aria-label="모바일 탭"><button id="tabSearchBtn" type="button" class="mobile-tab active"><span>⌕</span><em>검색</em></button><button id="tabListBtn" type="button" class="mobile-tab"><span>☷</span><em>목록</em></button><button id="tabFavBtn" type="button" class="mobile-tab"><span>♡</span><em>찜</em></button></nav><div class="float-nav" aria-label="페이지 이동"><button id="goTopBtn" type="button" aria-label="맨 위로">↑</button><button id="goBottomBtn" type="button" aria-label="맨 아래로">↓</button></div><script>
const PAGE_SIZE=100;

function readJsonStorage(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function loadFavoriteData(){const legacy=readJsonStorage(FAVORITE_LEGACY_KEY,[]);const saved=readJsonStorage(FAVORITE_LISTS_STORAGE_KEY,null);let lists=saved&&saved.lists&&typeof saved.lists==='object'?saved.lists:null;let names=saved&&saved.names&&typeof saved.names==='object'?saved.names:null;if(!lists){lists={fav1:Array.isArray(legacy)?legacy:[],fav2:[],fav3:[]};names={fav1:'',fav2:'',fav3:''}}['fav1','fav2','fav3'].forEach(id=>{if(!Array.isArray(lists[id]))lists[id]=[];if(!Object.prototype.hasOwnProperty.call(names,id))names[id]=''});let activeId=localStorage.getItem(ACTIVE_FAVORITE_LIST_KEY)||'fav1';if(!lists[activeId])activeId='fav1';return{lists,names,activeId}}

const els={q:document.getElementById('q'),searchBtn:document.getElementById('searchBtn'),sortBy:document.getElementById('sortBy'),resetBtn:document.getElementById('resetBtn'),titleOnly:document.getElementById('titleOnly'),authorOnly:document.getElementById('authorOnly'),exclude:document.getElementById('exclude'),discountRate:document.getElementById('discountRate'),resultCount:document.getElementById('resultCount'),activeSummary:document.getElementById('activeSummary'),list:document.getElementById('list'),empty:document.getElementById('empty'),error:document.getElementById('error'),loadMoreWrap:document.getElementById('loadMoreWrap'),loadMoreBtn:document.getElementById('loadMoreBtn'),goTopBtn:document.getElementById('goTopBtn'),goBottomBtn:document.getElementById('goBottomBtn'),bottomAnchor:document.getElementById('bottomAnchor'),detailToggleBtn:document.getElementById('detailToggleBtn'),detailRow:document.getElementById('detailRow')};
Object.assign(els,{favListBar:document.getElementById('favoriteListBar'),favListSelect:document.getElementById('favListSelect'),favListMenuBtn:document.getElementById('favListMenuBtn'),favListMenu:document.getElementById('favListMenu'),favListAddBtn:document.getElementById('favListAddBtn'),favListDeleteBtn:document.getElementById('favListDeleteBtn'),favListNameInput:document.getElementById('favListNameInput'),favListRenameBtn:document.getElementById('favListRenameBtn'),favListCount:document.getElementById('favListCount'),favDiscountRate:document.getElementById('favDiscountRate'),favPricePreset:document.getElementById('favPricePreset'),favoriteToast:document.getElementById('favoriteToast'),tasteTopBtn:document.getElementById('tasteTopBtn')});
function normalizeText(value){return String(value??'').trim().toLowerCase().replace(/\s+/g,'')}
function toNumber(value){if(typeof value==='number')return value;const text=String(value??'').replace(/[^\d.-]/g,'');const num=Number(text);return Number.isFinite(num)?num:0}
function historyCount(value){return String(value||'').split(',').map(v=>v.trim()).filter(Boolean).length}
function normalizeItem(item,index){
const title=String(item.title??'').trim();
const author=String(item.author??'').trim();
const history=String(item.history??item.pastDiscount??item['과거할인율']??'').trim();
const historyItems=parseHistory(history);
const latest=latestHistoryEntry(history);
return{
workId:String(item.workId??item.id??'').trim(),
title,author,
_titleNorm:normalizeText(title),
_authorNorm:normalizeText(author),
_joinedNorm:normalizeText(title+author),
link:String(item.link??'').trim(),
discount:toNumber(item.discount),
price:toNumber(item.price),
type:String(item.type??'').trim(),
cover:String(item.cover??item.coverUrl??item['표지주소']??item['표지']??'').trim(),
history,
_historyItems:historyItems,
_historyCache:null,
appearCount:historyItems.length,
latestEntry:latest,
originalIndex:index
}}
function hasSearchCriteria(){return Boolean(els.q.value.trim()||els.titleOnly.value.trim()||els.authorOnly.value.trim()||els.exclude.value.trim()||els.discountRate.value||state.selectedHistoryDate)}
function getRateKey(value){const m=String(value||'').match(/(\d+)\s*%/);return m?m[1]:''}
function historyMatchesSelected(item){const selectedDate=state.selectedHistoryDate,selectedRate=els.discountRate.value;if(!selectedDate&&!selectedRate)return true;return item._historyItems.some(entry=>{if(selectedDate&&entry.date!==selectedDate)return false;if(selectedRate&&getRateKey(entry.rate)!==selectedRate)return false;return true})}
function applyFilters(){const hasCriteria=hasSearchCriteria();if(!hasCriteria){state.filtered=[];state.visibleCount=PAGE_SIZE;updateSummary();render(true);return}const q=normalizeText(els.q.value),titleOnly=normalizeText(els.titleOnly.value),authorOnly=normalizeText(els.authorOnly.value),exclude=normalizeText(els.exclude.value);let result=state.items.filter(item=>{const title=item._titleNorm,author=item._authorNorm,joined=item._joinedNorm;if(!historyMatchesSelected(item))return false;if(q&&!(title.includes(q)||author.includes(q)))return false;if(titleOnly&&!title.includes(titleOnly))return false;if(authorOnly&&!author.includes(authorOnly))return false;if(exclude&&joined.includes(exclude))return false;return true});state.filtered=applySort(result);state.visibleCount=PAGE_SIZE;updateSummary();render(false)}
function applySort(list){const sort=els.sortBy.value,arr=[...list];const byText=f=>(a,b)=>String(a[f]||'').localeCompare(String(b[f]||''),'ko-KR',{numeric:true});if(sort==='titleAsc')arr.sort(byText('title'));if(sort==='authorAsc')arr.sort(byText('author'));if(sort==='default')arr.sort((a,b)=>a.originalIndex-b.originalIndex);return arr}
function updateSummary(){const p=[];if(state.selectedHistoryDate)p.push(`출현연월: ${state.selectedHistoryDate}`);if(els.q.value.trim())p.push(`통합: ${els.q.value.trim()}`);if(els.sortBy.value!=='default')p.push(`정렬: ${els.sortBy.options[els.sortBy.selectedIndex].textContent}`);if(els.discountRate.value)p.push(`할인율: ${els.discountRate.value}%`);if(els.titleOnly.value.trim())p.push(`제목: ${els.titleOnly.value.trim()}`);if(els.authorOnly.value.trim())p.push(`작가: ${els.authorOnly.value.trim()}`);if(els.exclude.value.trim())p.push(`제외: ${els.exclude.value.trim()}`);els.activeSummary.textContent=p.length?p.join(' · '):'필터 없음'}
function makeSearchLink(item){const q=encodeURIComponent(String(item.title||'').trim());return q?`https://ridibooks.com/search?q=${q}&adult_exclude=n&tab=WEBNOVEL&child_tab=BL_WEBNOVEL`:''}
function parseHistory(value){return String(value||'').split(',').map(v=>v.trim()).filter(Boolean).map(v=>{const m=v.match(/^(\d{6}\S*)\s+(.*)$/);return m?{date:m[1],rate:m[2].trim()||'-'}:{date:'기록',rate:v}})}
function latestHistoryEntry(value){const entries=parseHistory(value).filter(entry=>entry.date&&entry.date!=='기록');if(!entries.length)return null;return [...entries].sort((a,b)=>String(b.date).slice(0,6).localeCompare(String(a.date).slice(0,6),'ko-KR',{numeric:true}))[0]}
function populateDiscountOptions(){const rates=[...new Set(state.items.flatMap(item=>parseHistory(item.history).map(entry=>getRateKey(entry.rate)).filter(Boolean)))].sort((a,b)=>Number(a)-Number(b));const opts='<option value="">전체 할인율</option>'+rates.map(rate=>`<option value="${rate}">${rate}%</option>`).join('');els.discountRate.innerHTML=opts;if(els.favDiscountRate)els.favDiscountRate.innerHTML=opts}
function openHistoryModal(item){const backdrop=document.getElementById('historyModalBackdrop'),title=document.getElementById('historyModalTitle'),meta=document.getElementById('historyModalMeta'),body=document.getElementById('historyModalBody');title.textContent=item.title||'과거 할인율';meta.textContent=(item.author||'작가 정보 없음')+' · 과거 마크다운 할인율';body.innerHTML='';const entries=item._historyCache||(item._historyCache=item._historyItems);if(!entries.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='정리된 과거 할인율이 없습니다.';body.appendChild(empty)}else{entries.forEach(entry=>{const row=document.createElement('div');row.className='history-row';const date=document.createElement('span');date.className='history-date';date.textContent=entry.date;const rate=document.createElement('span');rate.className='history-rate';rate.textContent=entry.rate;row.append(date,rate);body.appendChild(row)})}backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
function closeHistoryModal(){const backdrop=document.getElementById('historyModalBackdrop');backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
function getHistoryDateCounts(){const counts=new Map();state.items.forEach(item=>{new Set(item._historyItems.map(entry=>entry.date).filter(date=>date&&date!=='기록')).forEach(date=>counts.set(date,(counts.get(date)||0)+1))});return [...counts.entries()].sort((a,b)=>b[0].localeCompare(a[0],'ko-KR',{numeric:true}))}
function getHistoryYears(){
return [...new Set(getHistoryDateCounts().map(([date])=>String(date).slice(0,4)).filter(Boolean))].sort((a,b)=>b.localeCompare(a,'ko-KR',{numeric:true}));
}
function populateDateYearFilter(){
const sel=document.getElementById('dateYearFilter');
if(!sel)return;
const current=sel.value;
const years=getHistoryYears();
sel.innerHTML='<option value="">전체 연도</option>'+years.map(y=>`<option value="${y}">${y}년</option>`).join('');
if(years.includes(current))sel.value=current;
}
function renderDateListInline(){
const wrap=document.getElementById('dateListInline');
const yearSel=document.getElementById('dateYearFilter');
const clearBtn=document.getElementById('dateListClearBtn');
if(!wrap)return;
if(clearBtn)clearBtn.disabled=!state.selectedHistoryDate;
const year=yearSel?yearSel.value:'';
const dates=getHistoryDateCounts().filter(([date])=>!year||String(date).startsWith(year));
wrap.innerHTML='';
if(!dates.length){
const empty=document.createElement('div');
empty.className='date-list-empty';
empty.textContent='정리된 출현연월이 없습니다.';
wrap.appendChild(empty);
return;
}
dates.forEach(([date,count])=>{
const isSelected=state.selectedHistoryDate===date;
const btn=document.createElement('button');
btn.type='button';
btn.className='date-list-item'+(isSelected?' active':'');
btn.setAttribute('aria-pressed',String(isSelected));
btn.innerHTML=`<span>${isSelected?'✓ ':''}${date}</span>`;
btn.addEventListener('click',()=>{
if(isSelected){
state.selectedHistoryDate='';
state.showDateList=true;
state.showFavorites=false;
document.body.classList.add('date-list-mode');
document.body.classList.remove('favorite-mode');

}

});

}
function setDateListMode(on){

if(on)state.showFavorites=false;

function openDateIndex(){const backdrop=document.getElementById('dateIndexBackdrop'),body=document.getElementById('dateIndexBody');body.innerHTML='';const clearBtn=document.createElement('button');clearBtn.type='button';clearBtn.className='clear-date-btn';clearBtn.textContent=state.selectedHistoryDate?'선택 해제':'전체 목차';clearBtn.addEventListener('click',()=>{state.selectedHistoryDate='';closeDateIndex();applyFilters()});body.appendChild(clearBtn);getHistoryDateCounts().forEach(([date,count])=>{const isSelected=state.selectedHistoryDate===date;const btn=document.createElement('button');btn.type='button';btn.className='date-chip'+(isSelected?' active':'');btn.setAttribute('aria-pressed',String(isSelected));btn.textContent=(isSelected?'✓ ':'')+date;btn.addEventListener('click',()=>{state.selectedHistoryDate=isSelected?'':date;closeDateIndex();applyFilters()});body.appendChild(btn)});backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
function closeDateIndex(){const backdrop=document.getElementById('dateIndexBackdrop');backdrop.classList.remove('open');backdrop.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
function itemKey(item){return item.workId||item.link||`${item.title}__${item.author}`}
function favoriteListIds(){return Object.keys(state.favoriteLists).sort((a,b)=>{const na=Number(String(a).replace(/\D/g,''))||0,nb=Number(String(b).replace(/\D/g,''))||0;return na-nb})}
function favoriteDisplayName(id){const n=String(state.favoriteNames[id]||'').trim();const num=String(id).replace(/\D/g,'')||'';return n?`찜${num} ${n}`:`찜${num}`}
function saveFavorites(){state.favoriteLists[state.activeFavoriteListId]=[...state.favorites];localStorage.setItem(FAVORITE_LISTS_STORAGE_KEY,JSON.stringify({lists:state.favoriteLists,names:state.favoriteNames}));localStorage.setItem(ACTIVE_FAVORITE_LIST_KEY,state.activeFavoriteListId);localStorage.setItem(FAVORITE_LEGACY_KEY,JSON.stringify([...state.favorites]))}
function refreshFavoriteListUI(){if(!els.favListSelect)return;const ids=favoriteListIds();els.favListSelect.innerHTML=ids.map(id=>`<option value="${id}">${favoriteDisplayName(id)}</option>`).join('');els.favListSelect.value=state.activeFavoriteListId;if(els.favListNameInput)els.favListNameInput.value=state.favoriteNames[state.activeFavoriteListId]||'';if(els.favListCount)els.favListCount.textContent=`${state.favorites.size.toLocaleString('ko-KR')}개`}
function switchFavoriteList(id){if(!state.favoriteLists[id])return;state.favoriteLists[state.activeFavoriteListId]=[...state.favorites];state.activeFavoriteListId=id;state.favorites=new Set(state.favoriteLists[id]||[]);saveFavorites();refreshFavoriteListUI();state.visibleCount=PAGE_SIZE;render(false);updateBottomTabs()}
function addFavoriteList(){const nums=favoriteListIds().map(id=>Number(String(id).replace(/\D/g,''))||0);const next=(nums.length?Math.max(...nums):0)+1;const id=`fav${next}`;state.favoriteLists[id]=[];state.favoriteNames[id]='';switchFavoriteList(id);if(els.favListMenu)els.favListMenu.hidden=true}
function deleteFavoriteList(){const ids=favoriteListIds();if(ids.length<=1){showFavoriteToast('찜목록은 1개 이상 필요합니다');return}const current=state.activeFavoriteListId;if(!confirm(`${favoriteDisplayName(current)}을 삭제할까요?`))return;delete state.favoriteLists[current];delete state.favoriteNames[current];const nextId=favoriteListIds()[0];state.activeFavoriteListId=nextId;state.favorites=new Set(state.favoriteLists[nextId]||[]);saveFavorites();refreshFavoriteListUI();state.visibleCount=PAGE_SIZE;render(false);if(els.favListMenu)els.favListMenu.hidden=true}
function renameFavoriteList(){const name=String(els.favListNameInput?.value||'').trim();state.favoriteNames[state.activeFavoriteListId]=name;saveFavorites();refreshFavoriteListUI();if(els.favListMenu)els.favListMenu.hidden=true}

(function(){
function isMobileLike(){

function applyMobileHeartVisibility(){

var topHeart=document.getElementById('tasteTopBtn');
if(topHeart){
if(mobile){
topHeart.style.setProperty('display','none','important');
topHeart.style.setProperty('visibility','hidden','important');

}else{
topHeart.style.removeProperty('display');
topHeart.style.removeProperty('visibility');
topHeart.setAttribute('aria-hidden','false');
topHeart.tabIndex=0;
}
}
document.querySelectorAll('.favorite-toggle').forEach(function(btn){
if(mobile){
btn.style.setProperty('display','none','important');
btn.style.setProperty('visibility','hidden','important');

btn.tabIndex=-1;
}else{
btn.style.removeProperty('display');
btn.style.removeProperty('visibility');
btn.setAttribute('aria-hidden','false');
btn.tabIndex=0;
}
});
}
document.addEventListener('DOMContentLoaded', applyMobileHeartVisibility);

})();
