.event-alert-item .event-alert-rate{display:inline-flex;align-items:center;justify-content:center;margin-top:7px;min-height:27px;padding:0 10px;border-radius:999px;background:#237a49;color:#FFFFFF;font-size:13px;font-weight:700;line-height:1;box-shadow:0 3px 9px rgba(25,94,55,.28),0 0 0 1px rgba(255,255,255,.22) inset}
.event-alert-section-title{display:flex;align-items:center;gap:6px;margin:4px 2px 8px;color:#3F3F46;font-size:14px;font-weight:700}
.event-alert-section-title:not(:first-child){margin-top:16px}
.message-alert-item{border:1px solid #E4E4E7;border-radius:15px;background:#FAFAFB;padding:13px;overflow:hidden}
.message-alert-item.is-read{background:#fff;border-color:#E7E7EA}
.message-alert-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px}
.message-alert-icon{flex:0 0 auto;font-size:21px;line-height:1.1}
.message-alert-title-wrap{min-width:0;flex:1}
.message-alert-title{display:block;color:#27272A;font-size:15px;font-weight:700;line-height:1.4}
.message-alert-info{display:block;margin-top:2px;color:#71717A;font-size:12px;line-height:1.45}
.message-alert-image{display:block;width:100%;max-height:480px;object-fit:contain;border:1px solid #E5E5E8;border-radius:11px;background:#F5F5F7}
.message-alert-text{margin:11px 1px 0;color:#44444C;font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.message-alert-image[hidden],.message-alert-text:empty{display:none}
.history-pill.current-event{position:relative;overflow:hidden;background:linear-gradient(135deg,#1f7a46 0%,#2f9a5d 58%,#237f4c 100%);border-color:#176238;color:#FFFFFF;font-weight:700;box-shadow:0 3px 9px rgba(25,94,55,.30),0 0 0 1px rgba(255,255,255,.22) inset;text-shadow:0 1px 1px rgba(0,0,0,.18);animation:currentEventGlow 2.8s ease-in-out infinite}
.history-pill.current-event::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.22) 44%,transparent 68%);transform:translateX(-130%);animation:currentEventShine 4.2s ease-in-out infinite;pointer-events:none}
.history-pill.current-event .current-event-text{position:relative;z-index:1}
@keyframes currentEventGlow{0%,100%{filter:brightness(1);box-shadow:0 3px 9px rgba(25,94,55,.30),0 0 0 1px rgba(255,255,255,.22) inset}50%{filter:brightness(1.08);box-shadow:0 4px 13px rgba(25,94,55,.42),0 0 0 1px rgba(255,255,255,.30) inset}}
@keyframes currentEventShine{0%,58%{transform:translateX(-130%)}78%,100%{transform:translateX(130%)}}
@media(max-width:390px){.history-pill.current-event{white-space:normal;text-align:center;line-height:1.02;padding-top:3px;padding-bottom:3px}.history-pill.current-event .current-event-text{display:block;max-width:64px}}
@media(prefers-reduced-motion:reduce){.history-pill.current-event,.history-pill.current-event::after{animation:none}}
.event-alert-empty{padding:26px 10px;text-align:center;color:#71717A}
.card.event-alert-focus{animation:eventAlertFocus 2.2s ease;outline:3px solid #d99797;outline-offset:3px}
@keyframes eventAlertFocus{0%,35%{background:#fff0f0}100%{background:inherit}}
