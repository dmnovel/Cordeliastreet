@media (min-width: 768px) {
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .shell { width: min(100%, 510px); margin: auto; padding: 24px 12px; }
}

/* GAME ARCADE THEME — unified, bright, low-glare cream / blue-gray / peach / mint */
:root{color-scheme:light;--bg:#faf5eb;--panel:#fffdf8;--ink:#344853;--muted:#6e808b;--edge:#b8ccd5;--soft:#e6eff3;--accent:#ce8867;--accent2:#b87454;--mint:#b6ded2;--bad:#ce5767;--good:#3b9273;--shadow:0 5px 0 rgba(86,116,129,.17),0 13px 22px rgba(81,109,121,.09);}
html{-webkit-text-size-adjust:100%}body{background:radial-gradient(ellipse 70% 25% at 50% 0%,#e8f1ef 0%,transparent 100%),#faf5eb;color:var(--ink);min-height:100dvh;}
.shell{padding-top:max(16px,env(safe-area-inset-top));max-width:650px;}
.top{margin-bottom:22px;}.top h1{color:#385d68;font-weight:900;letter-spacing:-.7px;text-shadow:0 2px 0 #fff,0 3px 0 #bdd0d8;}

.intro{font-weight:650;color:#657981;margin-bottom:20px;}
.feature{background:linear-gradient(160deg,#fff1e5 0%,#f4d5c2 58%,#edc7b0 100%);color:#774a37;border:2px solid #dbad91;border-bottom:6px solid #c58f71;border-radius:23px;min-height:116px;box-shadow:inset 0 3px 0 #ffffffbc,0 6px 0 #d6b29a65,0 12px 16px #987b6730;transition:transform .13s,box-shadow .13s;}
.feature strong{font-size:21px;text-shadow:0 2px 0 #fff8ef;}.feature span{font-weight:650;}
.cards{gap:13px;}.game-card,.game-card:nth-child(n){background:linear-gradient(165deg,#f8fcfc 0%,#e0eef2 55%,#d4e4e9 100%);border:2px solid #b3cbd5;border-bottom:6px solid #a1bac5;border-radius:20px;min-height:125px;box-shadow:inset 0 3px 0 #ffffffc9,0 5px 0 #94adba44,0 10px 15px #7d9aa72b;transition:transform .13s,box-shadow .13s;color:#344f5b}

.panel{background:linear-gradient(180deg,#fffefb,#fffbf5);border:2px solid #c4d5dc;border-bottom:5px solid #b6cbd3;border-radius:23px;box-shadow:0 8px 20px #9bafba32;padding:20px;}

.prompt{background:linear-gradient(#f2f8fa,#dfeaf0);border:2px solid #c2d5dd;box-shadow:inset 0 2px 5px #acc5cd2f;border-radius:19px;}

input[type=text]{background:#fffefb;border:2px solid #bcced6;border-bottom:4px solid #a5bec8;border-radius:14px;color:#344853;box-shadow:inset 0 2px 5px #a6bcc51e;}

.primary{background:linear-gradient(180deg,#f1bd9b 0%,#d99370 53%,#d18563 100%);border:2px solid #ce8b69;border-bottom:5px solid #a96d51;border-radius:17px;color:#fffdf7;font-size:16px;font-weight:900;text-shadow:0 1px 1px #84513a77;box-shadow:inset 0 2px 0 #ffe7d5b3,0 5px 0 #b4816640,0 9px 15px #af88763b;transition:transform .13s,box-shadow .13s,filter .13s;}

.outline:active,.small-btn:active{transform:translateY(2px);border-bottom-width:2px}
.actions{margin-top:11px;}.feedback{min-height:0;margin:10px 0 3px;text-align:center;font-size:15px;font-weight:850;}.feedback:empty{display:none;}.feedback.good{color:#287f62;}.feedback.bad{color:#c94457;}
.footer-actions{margin-top:19px;}.footer-actions>*{flex:1;}
.initial{background:linear-gradient(155deg,#fffef5,#d9eee8);border:2px solid #a8d1c4;border-bottom:5px solid #81baa9;border-radius:12px;color:#315e55;box-shadow:inset 0 2px #fff,0 4px 0 #9dc9bd7a,0 8px 9px #8bb7b055;font-weight:900;}
.initial.good{background:linear-gradient(#e3f9e9,#bde9cd);border-color:#63af82;color:#226949;}.initial-punct{color:#c58060;}
.pair{background:linear-gradient(#fffdf8,#e8f0f2);border:2px solid #afc9d0;border-bottom:4px solid #93b3bf;box-shadow:inset 0 1px #fff,0 3px 6px #89a9b72a;border-radius:11px;color:#385562;font-weight:800;}
.pair.selected{background:#f8dfd0;outline:3px solid #dfa587;}.pair.linked{background:#d9f0e3;border-color:#77b79b;color:#236a50;}
.puzzle-toolbar select{background:linear-gradient(#fffefa,#e9f1f2);border:2px solid #b8cdd6;border-radius:12px;color:#364d55;font-weight:750;}
.tile{background:linear-gradient(150deg,#fafdfd,#e7eff3);border:2px solid #b9ccd5;border-bottom-width:3px;box-shadow:inset 0 1px 0 #fff;color:#344f5b;transition:transform .18s ease-in-out;}
.tile.filler{background:#d9e5e9;border-color:#c3d4dc;}
.tile.empty,.tile.empty.chosen{background:#e7f8ee;border:2px dashed #65b58a;outline:0;box-shadow:0 0 0 3px #8ccbad63,0 0 11px #71b6985c;animation:none;transform:none}
.tile.target{border-color:#d45d69;box-shadow:inset 0 0 0 1px #d45d69;}.tile.solved{background:#d7f3df;border-color:#5fac78;box-shadow:inset 0 0 0 1px #5fac78;}
.done .emoji{filter:drop-shadow(0 4px 3px #d1ac7680);}
@media(prefers-color-scheme:dark){:root{color-scheme:light;--bg:#faf5eb;--panel:#fffdf8;--ink:#344853;--muted:#6e808b;--edge:#b8ccd5;--soft:#e6eff3;--accent:#ce8867;--accent2:#b87454;--mint:#b6ded2;--bad:#ce5767;--good:#3b9273;--shadow:0 5px 0 rgba(86,116,129,.17),0 13px 22px rgba(81,109,121,.09)}.tile.filler{background:#d9e5e9}.initial.good,.tile.solved{background:#d7f3df;color:#226949}.pair.linked{background:#d9f0e3;color:#236a50}}
@media(prefers-reduced-motion:reduce){.game-card,.feature,.primary,.next-btn,.tile{transition:none}}

@media(max-width:520px){.game-profile-modal{padding:clamp(12px,3.5vw,20px);}}

/* Long initial-consonant hints: wrap within the quiz panel on any viewport. */
.initials, .initials.hinted {max-width:100%;min-width:0;overflow-wrap:anywhere;}
.initials.hinted .initial-word {
  display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;
  max-width:100%;min-width:0;white-space:normal;row-gap:4px;column-gap:4px;
}
.initials.hinted .initial {min-width:0;max-width:100%;width:auto;flex:0 1 auto;}
/* Random-game answer selected: distinct from standard blue button. */
.cards [data-opt].mix-selected {
  border:3px solid #4caa78 !important;
  box-shadow:0 0 0 3px rgba(115,215,155,.22),0 5px 12px rgba(49,153,104,.24),inset 0 1px 0 rgba(255,255,255,.9) !important;
}

/* Random-game pair choices: visible selected state for single and multiple answers. */
.panel .cards button.outline[data-opt].mix-selected,
.panel .cards button.outline[data-opt][aria-pressed="true"] {
  background:linear-gradient(180deg,#edfff1 0%,#c3edcf 100%) !important;
  border:3px solid #34a86c !important;
  border-bottom:7px solid #208653 !important;
  color:#165b3e !important;
  box-shadow:0 0 0 3px rgba(64,192,115,.32),0 5px 13px rgba(37,145,86,.28),inset 0 1px 0 #fff !important;
  text-shadow:none !important;
}

/* Prevent double-tap zoom throughout the game while retaining normal scrolling,
   input editing and intentional pinch-to-zoom accessibility. */
html, body, #app, .shell, .game-profile-backdrop, .game-profile-modal {
  touch-action: manipulation;
}
button, a, .game-card, .intro-option, .initial, .initial-word, .tile,
.pair, .puzzle-grid, .cards, .panel, .prompt, .excerpt-picture,
.game-profile-stats, .intro-master-link { touch-action: manipulation; }

function puzzleSizedId(title,size){return 'puzzle:'+size+':'+normal(title)}
function puzzleEligible(item){return item&&typeof item.title==='string'&&!puzzleExcluded.has(normal(item.title))&&!item.discontinued&&!item.soldOut&&!item.isDiscontinued&&!['판중','판매중지','판매종료','절판'].includes(String(item.status||'').trim())}

function puzzleStageStats(n){const pool=puzzleForSize(n);const ids=new Set((gameProfile.solvedIds||[]));const unique=new Map(pool.map(x=>[normal(x.title),x]));return {total:unique.size,got:[...unique.values()].filter(x=>ids.has(puzzleSizedId(x.title,n))).length}}
function defaultGameStats(){return {cover:{correct:0,score:0,clears:0,level:1},initials:{correct:0,score:0,clears:0,level:1},couples:{correct:0,score:0,clears:0,level:1},excerpt:{correct:0,score:0,clears:0,level:1},dialogue:{correct:0,score:0,clears:0,level:1},puzzle:{correct:0,score:0,clears:0,level:1,bestSize:5},mix:{correct:0,score:0,clears:0,level:1}}}
function defaultGameProfile(){return {name:'',totalCorrect:0,totalScore:0,games:defaultGameStats(),solvedIds:[],scoreVersion:2,savedAt:''}}
function mergeProfile(src){const base=defaultGameProfile();if(!src||typeof src!=='object')return base;base.name=String(src.name||'').replace(/\s+/g,'').slice(0,6);base.totalCorrect=Number(src.totalCorrect)||0;base.totalScore=Number(src.totalScore)||0;base.savedAt=String(src.savedAt||'');if(src.scoreVersion===2){base.scoreVersion=2;base.solvedIds=Array.isArray(src.solvedIds)?src.solvedIds.filter(x=>typeof x==='string').slice(0,200000):[];if(src.legacyScore)base.legacyScore=src.legacyScore;}else{base.legacyScore={totalCorrect:Number(src.totalCorrect)||0,totalScore:Number(src.totalScore)||0,games:src.games||{}};base.solvedIds=[];}GAME_TYPES.forEach(k=>{const s=src.games&&src.games[k]||{};base.games[k]={...base.games[k],...Object.fromEntries(Object.entries(s).filter(([kk,v])=>['correct','score','clears','level','bestSize'].includes(kk) && Number.isFinite(Number(v))).map(([kk,v])=>[kk,Number(v)]))};});if(src.scoreVersion!==2){base.totalCorrect=0;base.totalScore=0;base.games=defaultGameStats();}return base}

// 한 문제를 처음 맞힐 때만 1점. 랜덤게임은 원본 문항과 같은 ID를 공유합니다.
function questionId(type,index){if(type==='puzzle')return 'puzzle:'+normal(index);if(type==='couples')return 'couples:'+normal(GAME_DATA.couples[index]?.a||'')+':'+normal(GAME_DATA.couples[index]?.b||'');const item=GAME_DATA[type]?.[index];if(!item)return null;return type+':'+String(index)}
function allQuestionIds(){const ids=[];for(const type of ['cover','initials','couples','excerpt','dialogue'])GAME_DATA[type].forEach((item,i)=>{if(!item.demo)ids.push(questionId(type,i))});for(const n of PUZZLE_SIZES)puzzleForSize(n).forEach(x=>ids.push(puzzleSizedId(x.title,n)));return [...new Set(ids.filter(Boolean))]}
function levelFor(correct,total){if(!total)return 1;return Math.max(1,Math.min(5,1+Math.floor(5*Math.min(correct,total)/total)))}
function correctCount(type){const prefix=type+':';return new Set(gameProfile.solvedIds||[]).size ? (gameProfile.solvedIds||[]).filter(id=>id.startsWith(prefix)).length:0}
function computeLevel(type){const total=type==='mix'?allQuestionIds().length:type==='puzzle'?PUZZLE_SIZES.reduce((sum,n)=>sum+puzzleStageStats(n).total,0):(GAME_DATA[type]?.filter(x=>!x.demo).length||0);return levelFor(type==='mix'?gameProfile.totalCorrect:type==='puzzle'?PUZZLE_SIZES.reduce((sum,n)=>sum+puzzleStageStats(n).got,0):correctCount(type),total)}

function bindBack(fn=home){document.getElementById('back')?.addEventListener('click',fn)}
function bindHeaderUI(){document.getElementById('userProfileBtn')?.addEventListener('click',()=>openProfileModal(false));document.getElementById('gameHomeBtn')?.addEventListener('click',intro)}
function resetMiniGameData(includeName=false){GAME_TYPES.forEach(type=>clear(type));gameProfile.totalCorrect=0;gameProfile.totalScore=0;gameProfile.games=defaultGameStats();gameProfile.solvedIds=[];gameProfile.scoreVersion=2;if(includeName)gameProfile.name='';saveGameProfile(false);updateProfileButton();if(document.getElementById('gameProfileBackdrop'))renderProfileSnapshot()}
function ensureOptionsModal(){if(document.getElementById('introOptionsBackdrop'))return;document.body.insertAdjacentHTML('beforeend',`<div id="introOptionsBackdrop" class="game-profile-backdrop" aria-hidden="true"><section class="game-profile-modal intro-options-modal" role="dialog" aria-modal="true" aria-labelledby="introOptionsTitle"><div class="game-profile-head"><h2 id="introOptionsTitle">OPTIONS</h2><button type="button" id="introOptionsClose" class="profile-close" aria-label="닫기">×</button></div><p class="game-profile-desc">시작 메뉴에서 사용할 옵션입니다. 저장된 게임 기록을 정리하거나 아이디까지 전체 초기화할 수 있습니다.</p><div class="intro-options-actions"><button type="button" id="introResetStats" class="outline">기록만 초기화</button><button type="button" id="introResetAll" class="outline danger">아이디까지 전체 초기화</button><button type="button" id="introOptionsCloseBtn" class="primary">닫기</button></div><p class="intro-options-help">‘기록만 초기화’는 아이디를 유지한 채 점수와 저장된 진행만 지웁니다.</p></section></div>`);document.getElementById('introOptionsClose').addEventListener('click',closeOptionsModal);document.getElementById('introOptionsCloseBtn').addEventListener('click',closeOptionsModal);document.getElementById('introOptionsBackdrop').addEventListener('click',e=>{if(e.target.id==='introOptionsBackdrop')closeOptionsModal()});document.getElementById('introResetStats').addEventListener('click',()=>{if(confirm('아이디는 유지하고 게임 기록만 초기화할까요?')){resetMiniGameData(false);alert('게임 기록을 초기화했습니다.');closeOptionsModal();intro();}});document.getElementById('introResetAll').addEventListener('click',()=>{if(confirm('아이디와 게임 기록을 모두 초기화할까요?')){resetMiniGameData(true);alert('아이디와 게임 기록을 모두 초기화했습니다.');closeOptionsModal();intro();}})}
function openOptionsModal(){ensureOptionsModal();const b=document.getElementById('introOptionsBackdrop');b.classList.add('open');b.setAttribute('aria-hidden','false');document.body.classList.add('modal-open')}
function closeOptionsModal(){const b=document.getElementById('introOptionsBackdrop');if(!b)return;b.classList.remove('open');b.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}
function isTouchLikeDevice(){return (window.matchMedia&&window.matchMedia('(hover: none), (pointer: coarse)').matches)||('ontouchstart' in window)}
let introSelection=0;
function introModes(){const hasRemembered=!!sanitizeName(gameProfile.name);return [
  {id:'new',title:'새 게임',disabled:false},
  {id:'continue',title:'이어서',disabled:!hasRemembered},
  {id:'options',title:'옵션',disabled:false}
]}
function syncIntroSelection(){const buttons=[...document.querySelectorAll('.intro-option')];if(!buttons.length)return;const modes=introModes();let idx=introSelection;if(modes[idx]?.disabled||idx<0||idx>=modes.length)idx=modes.findIndex(m=>!m.disabled);if(idx<0)idx=0;introSelection=idx;buttons.forEach((btn,i)=>{const selected=i===introSelection;btn.classList.toggle('selected',selected);btn.setAttribute('aria-selected',selected?'true':'false');btn.tabIndex=selected?0:-1;const p=btn.querySelector('.pointer');if(p)p.textContent='▶';})}
function moveIntroSelection(step){const modes=introModes();if(!modes.length)return;let idx=introSelection;for(let i=0;i<modes.length;i++){idx=(idx+step+modes.length)%modes.length;if(!modes[idx].disabled){introSelection=idx;break;}}syncIntroSelection();document.querySelectorAll('.intro-option')[introSelection]?.focus();}
function chooseIntroMode(modeId){if(modeId==='continue'&&!sanitizeName(gameProfile.name))return;if(modeId==='options'){openOptionsModal();return;}home();}
function bindIntroMenu(){const buttons=[...document.querySelectorAll('.intro-option')];buttons.forEach((btn,i)=>{btn.addEventListener('click',()=>{if(btn.classList.contains('disabled'))return;const selectOnly=isTouchLikeDevice()&&introSelection!==i;introSelection=i;syncIntroSelection();if(selectOnly)return;chooseIntroMode(btn.dataset.mode)});btn.addEventListener('mouseenter',()=>{if(btn.classList.contains('disabled'))return;introSelection=i;syncIntroSelection()});});document.getElementById('introProfileQuickBtn')?.addEventListener('click',()=>openProfileModal(false));syncIntroSelection();}
function onIntroKeydown(e){if(current!=='intro'||document.body.classList.contains('modal-open'))return;if(e.key==='ArrowUp'){e.preventDefault();moveIntroSelection(-1);}else if(e.key==='ArrowDown'){e.preventDefault();moveIntroSelection(1);}else if(e.key==='Enter'){e.preventDefault();const btn=document.querySelectorAll('.intro-option')[introSelection];if(btn&&!btn.classList.contains('disabled'))chooseIntroMode(btn.dataset.mode);}}

function start(game,reset=false){current=game;locked=false;feedback='';flash=false;if(game==='puzzle'){puzzleLevel=1;puzzleCount=0;newPuzzle();return}if(game==='couples'){newCouples();return}if(game==='mix'){showMixModePicker();return}if(!reset){
  const saved=load(game);
  if(saved?.type===game&&Number.isInteger(saved.index)&&saved.index>=0&&saved.index<=GAME_DATA[game].length&&Array.isArray(saved.order)){
    const count=GAME_DATA[game].length;
    const valid=saved.order.filter((n,i,a)=>Number.isInteger(n)&&n>=0&&n<count&&a.indexOf(n)===i);
    const added=shuffled(GAME_DATA[game].map((_,i)=>i).filter(i=>!valid.includes(i)));
    active={type:game,index:Math.min(saved.index,valid.length),order:valid.concat(added)};
    save(game,active);renderQuiz();return;
  }
}
active={type:game,index:0,order:unseenFirst(GAME_DATA[game].map((_,i)=>i),i=>questionId(game,i))};save(game,active);renderQuiz()}

let quizAdvanceTimer=null;let puzzleChosen=false;let puzzleAnimating=false;let puzzleInvalidTimer=null;
function clearQuizAdvance(){if(quizAdvanceTimer!==null){clearTimeout(quizAdvanceTimer);quizAdvanceTimer=null}}
function advanceAfterThreeSeconds(fn){clearQuizAdvance();quizAdvanceTimer=setTimeout(()=>{quizAdvanceTimer=null;fn()},3000)}
function base(title,body){clearQuizAdvance();app.innerHTML=renderGameHeader(title,true)+body;bindBack();bindHeaderUI()}
const HANGUL_INITIALS='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function initialLetter(ch){const cp=ch.codePointAt(0);return cp>=44032&&cp<=55203?HANGUL_INITIALS[Math.floor((cp-44032)/588)]:ch}
function initialMarkup(item,showHint=false){
  const title=item.answer;
  const cell=ch=>`<span class="initial">${esc(initialLetter(ch))}</span>`;
  if(!showHint)return [...title].filter(ch=>!/[\s\p{P}\p{S}]/u.test(ch)).map(cell).join('');
  return title.match(/\s+|[^\s]+/gu).map(part=>{
    if(/^\s+$/u.test(part))return '';
    const bits=[...part].map(ch=>/[\p{P}\p{S}]/u.test(ch)?`<span class="initial-punct">${esc(ch)}</span>`:cell(ch)).join('');
    return `<span class="initial-word">${bits}</span>`;
  }).join('');
}
function hintMarkup(item){return `<div class="initial-help"><button type="button" class="outline" id="space-hint">💡 띄어쓰기 힌트</button><small>정답 입력 시 띄어쓰기·기호는 생략해도 됩니다.</small></div>`}
function bindInitialHint(item){const btn=document.getElementById('space-hint');if(!btn)return;btn.addEventListener('click',()=>{const el=document.getElementById('initials');if(!el||el.classList.contains('hinted'))return;el.classList.add('hinted');el.innerHTML=initialMarkup(item,true);btn.disabled=true;btn.textContent='띄어쓰기·기호 힌트 사용됨';});}
function quizText(type,item){if(type==='initials')return `<p class="question">아래 초성에 해당하는 작품의 제목은?</p><div class="initials" id="initials">${initialMarkup(item)}</div>${hintMarkup(item)}`;if(type==='cover')return `<p class="question">아래 표지 조각의 작품 제목은?</p><p class="image-zoom-note">이미지를 클릭하면 확대됩니다.</p><div class="prompt image-crop cover-natural">${item.image?`<button type="button" class="excerpt-image-open" aria-label="표지 조각 확대하기"><img src="${esc(item.image)}" alt="표지 조각"></button>`:`<span class="image-placeholder">${esc(item.text)}</span>`}</div>`;if(type==='dialogue')return `<p class="question">아래 대사의 주인공 이름은?</p><div class="prompt bubble">${esc(item.text)}</div>`;return `<p class="question">아래 발췌가 나오는 작품의 제목은?</p>${item.image?`<p class="image-zoom-note">이미지를 클릭하면 확대됩니다.</p><div class="prompt excerpt-picture"><button type="button" class="excerpt-image-open" aria-label="발췌 이미지 확대하기"><img src="${esc(item.image)}" alt="발췌 이미지"></button></div>`:`<div class="prompt excerpt">${esc(item.text)}</div>`}`}

function getQuestion(type,index){return GAME_DATA[type]?.[index]}
function renderQuiz(){const {type,index}=active;const arr=GAME_DATA[type];if(index>=arr.length){complete(type,arr.length);return}const item=arr[active.order[index]];locked=false;feedback='';base(GAME_INFO[type].label,`<section class="panel"><div class="question-head"><strong>${GAME_INFO[type].emoji} ${GAME_INFO[type].label}</strong><span class="counter">${index+1} / ${arr.length}</span></div>${item.demo?'<p class="sample">※ 아직 실제 문제 데이터가 없는 예시 문항입니다.</p>':''}${quizText(type,item).replace('</p>','</p><p id="feedback" class="feedback" role="status" aria-live="polite"></p>')}<form id="answer-form"><input id="answer" type="text" placeholder="${type==='dialogue'?'주인공 이름':'작품 제목'} 입력" autocomplete="off" aria-label="정답 입력" required><div class="actions"><button class="primary" type="submit" id="submit">제출</button></div></form></section>${footer(type)}`);document.getElementById('answer-form').addEventListener('submit',e=>{e.preventDefault();const inp=document.getElementById('answer');const answer=normal(inp.value);const accepted=(item.answers||[item.answer]).some(x=>normal(x)===answer);let stat=document.getElementById('feedback');stat.className='feedback '+(accepted?'good':'bad');stat.textContent=accepted?'정답입니다!':'틀렸습니다.';if(accepted){if(!item.demo)recordCorrect(type,1,1,questionId(type,active.order[index]));locked=true;document.getElementById('answer').disabled=true;document.getElementById('submit').disabled=true;document.querySelectorAll('.initial').forEach(e=>e.classList.add('good'));save(type,{...active,index:index+1});advanceAfterThreeSeconds(()=>{if(current!==type||!active||active.index!==index)return;active.index++;renderQuiz()})}else{const initials=document.querySelectorAll('.initial');initials.forEach(e=>{e.classList.remove('bad');void e.offsetWidth;e.classList.add('bad')});inp.select()}});if(type==='initials')bindInitialHint(item);bindRestart(type)}
function footer(type){return `<div class="footer-actions"><button class="outline" id="restart">처음부터 다시풀기</button><button class="outline" id="menu">게임 목록으로</button></div>`}
function bindRestart(type,fn){document.getElementById('menu')?.addEventListener('click',home);document.getElementById('restart')?.addEventListener('click',()=>{if(confirm('처음부터 다시풀까요? 현재 진행 내용은 초기화됩니다.')){if(fn)fn();else{clear(type);start(type,true)}}})}
function complete(type,count){recordClear(type,20);base(GAME_INFO[type].label,`<section class="panel done"><div class="emoji">🎉</div><h2>모두 맞혔습니다!</h2><p>${count}문제를 완료했습니다.</p><button class="primary" id="again">처음부터 다시풀기</button></section><div class="footer-actions"><button class="outline" id="menu">게임 목록으로</button></div>`);document.getElementById('again').onclick=()=>{clear(type);start(type,true)};document.getElementById('menu').onclick=home}
// 짝 잇기: 최대 10커플 무작위 추첨, 양쪽 방향도 무작위, 저장 없음
let pairState=null;
function newCouples(){current='couples';const ordered=unseenFirst(GAME_DATA.couples,(x)=>questionId('couples',GAME_DATA.couples.indexOf(x)));const chosen=[],usedNames=new Set();for(const x of ordered){if(usedNames.has(x.a)||usedNames.has(x.b))continue;chosen.push(x);usedNames.add(x.a);usedNames.add(x.b);if(chosen.length===10)break;}pairState={left:[],right:[],connected:[],selected:null};const oriented=chosen.map((x,i)=>{const flip=Math.random()<0.5;return {id:i,sourceIndex:GAME_DATA.couples.indexOf(x),left:flip?x.b:x.a,right:flip?x.a:x.b}});pairState.left=shuffled(oriented.map(x=>({id:x.id,sourceIndex:x.sourceIndex,name:x.left})));pairState.right=shuffled(oriented.map(x=>({id:x.id,name:x.right})));renderCouples()}
function coupleAnswerMarkup(s){return `<section class="pair-answer-guide"><h3>정답 안내</h3><ul>${s.left.map(leftItem=>{const rightItem=s.right.find(x=>x.id===leftItem.id);return `<li><span>${esc(leftItem.name)}</span><em>↔</em><span>${esc(rightItem?.name||'')}</span></li>`}).join('')}</ul></section>`}
function renderCouples(){const s=pairState;const total=s.left.length;base('주인공 짝 잇기',`<section class="panel"><div class="question-head"><strong>💘 주인공 짝 잇기</strong><span class="counter" id="pair-count">${s.connected.length} / ${total}</span></div><p class="pair-note">왼쪽이나 오른쪽 이름을 먼저 선택한 뒤 반대쪽에서 짝을 찾아보세요. 양쪽 이름은 무작위로 배치됩니다.</p><div class="pair-area"><svg class="connections" id="lines" aria-hidden="true"></svg><div class="pair-board"><div class="pair-col" id="left-col">${s.left.map((x,i)=>`<button class="pair" data-side="left" data-index="${i}">${esc(x.name)}</button>`).join('')}</div><div class="pair-col" id="right-col">${s.right.map((x,i)=>`<button class="pair" data-side="right" data-index="${i}">${esc(x.name)}</button>`).join('')}</div></div></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><div id="pair-answer-guide" hidden></div><div class="actions" id="pair-next" hidden><button class="primary" id="again">새로운 커플 풀기</button></div></section>${footer('couples')}`);app.querySelectorAll('.pair').forEach(el=>el.addEventListener('click',()=>{const side=el.dataset.side,i=+el.dataset.index;const clicked=(side==='left'?s.left:s.right)[i];if(s.connected.includes(clicked.id))return;const f=document.getElementById('feedback');if(!s.selected||s.selected.side===side){s.selected={side,index:i};updatePairs();return;}const first=s.selected;const firstItem=(first.side==='left'?s.left:s.right)[first.index];if(firstItem.id===clicked.id){const leftItem=first.side==='left'?firstItem:clicked;recordCorrect('couples',1,1,questionId('couples',leftItem.sourceIndex));s.connected.push(clicked.id);s.selected=null;f.textContent='정답입니다!';f.className='feedback good';updatePairs();if(s.connected.length===total){recordClear('couples',20);f.textContent='정답입니다! '+total+'개를 모두 연결했습니다.';document.getElementById('pair-next').hidden=false;const guide=document.getElementById('pair-answer-guide');if(guide){guide.hidden=false;guide.innerHTML=coupleAnswerMarkup(s);}}}else{f.textContent='틀렸습니다.';f.className='feedback bad';updatePairs();}}));document.getElementById('again').onclick=newCouples;bindRestart('couples',newCouples);updatePairs()}
function updatePairs(){const s=pairState;document.getElementById('pair-count').textContent=`${s.connected.length} / ${s.left.length}`;const left=[...document.querySelectorAll('[data-side="left"]')],right=[...document.querySelectorAll('[data-side="right"]')];left.forEach((b,i)=>{b.classList.toggle('linked',s.connected.includes(s.left[i].id));b.classList.toggle('selected',s.selected?.side==='left'&&s.selected.index===i)});right.forEach((b,i)=>{b.classList.toggle('linked',s.connected.includes(s.right[i].id));b.classList.toggle('selected',s.selected?.side==='right'&&s.selected.index===i)});const svg=document.getElementById('lines'),area=document.querySelector('.pair-area');const r=area.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML=s.connected.map(id=>{const l=left[s.left.findIndex(x=>x.id===id)].getBoundingClientRect(),rr=right[s.right.findIndex(x=>x.id===id)].getBoundingClientRect();const x1=l.right-r.left,y1=l.top-r.top+l.height/2,x2=rr.left-r.left,y2=rr.top-r.top+rr.height/2;return `<path d="M${x1},${y1} C${x1+25},${y1} ${x2-25},${y2} ${x2},${y2}" fill="none" stroke="#379b79" stroke-width="3" stroke-linecap="round"/>`}).join('')}

window.addEventListener('keydown',onIntroKeydown);
window.addEventListener('resize',()=>{if(current==='couples'&&pairState&&document.getElementById('lines'))updatePairs()});
// 랜덤 믹스: 등록된 개별 게임 문항에서 한 문제 단위로 추출, 총 10문제, 저장 없음.
let mixState=null;
function closeMixModePicker(){const backdrop=document.getElementById('mixModeBackdrop');if(!backdrop)return;backdrop.remove();if(!document.querySelector('.game-profile-backdrop.open,.intro-options-backdrop.open'))document.body.classList.remove('modal-open')}
function showMixModePicker(){
  clearQuizAdvance();closeMixModePicker();
  const backdrop=document.createElement('div');backdrop.id='mixModeBackdrop';backdrop.className='mix-mode-backdrop';backdrop.setAttribute('aria-hidden','false');
  backdrop.innerHTML=`<section class="mix-mode-modal" role="dialog" aria-modal="true" aria-labelledby="mixModeTitle"><h2 id="mixModeTitle">🎲 랜덤게임 난이도</h2><p>슬라이딩 퍼즐 크기를 선택해 주세요.<br>총 10문제가 랜덤으로 출제됩니다.</p><div class="mix-modes">${[[5,'이지'],[10,'노멀'],[15,'하드']].map(([n,label])=>`<button type="button" class="mix-mode-btn" data-mix-size="${n}"><strong>${label}</strong><span>${n}×${n}</span></button>`).join('')}</div><button type="button" class="mix-mode-cancel" id="mixModeCancel">취소</button></section>`;
  document.body.appendChild(backdrop);document.body.classList.add('modal-open');
  backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeMixModePicker()});
  backdrop.querySelector('#mixModeCancel').addEventListener('click',closeMixModePicker);
  backdrop.querySelectorAll('[data-mix-size]').forEach(btn=>btn.addEventListener('click',()=>{mixDifficulty=Number(btn.dataset.mixSize);closeMixModePicker();newMix()}));
  backdrop.querySelector('[data-mix-size]')?.focus();
}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('mixModeBackdrop')){e.preventDefault();closeMixModePicker()}});
function mixPool(){const pool=[];for(const key of ['initials','cover','excerpt','dialogue'])GAME_DATA[key].forEach((item,index)=>pool.push({type:key,index}));GAME_DATA.couples.forEach((item,index)=>pool.push({type:'pair-single',index}));puzzleForSize(mixDifficulty).forEach(item=>pool.push({type:'puzzle-single',title:item.title}));return pool}
async function newMix(){clearQuizAdvance();current='mix';try{await ensurePuzzleData()}catch(e){console.warn('슬라이딩 제목 데이터 연결 실패:',e)}const pool=mixPool();const qId=q=>q.type==='pair-single'?questionId('couples',q.index):q.type==='puzzle-single'?puzzleSizedId(q.title,mixDifficulty):questionId(q.type,q.index);const sliding=unseenFirst(pool.filter(q=>q.type==='puzzle-single'),qId).slice(0,2);const other=unseenFirst(pool.filter(q=>q.type!=='puzzle-single'),qId).slice(0,10-sliding.length);mixState={questions:shuffled([...sliding,...other]),index:0,difficulty:mixDifficulty};renderMix()}
function renderMix(){clearQuizAdvance();const s=mixState;if(s.index>=s.questions.length){base('랜덤게임',`<section class="panel done"><div class="emoji">🎉</div><h2>10문제 완료!</h2><button class="primary" id="again">다시 풀기</button></section>${footer('mix')}`);document.getElementById('again').onclick=showMixModePicker;bindRestart('mix',newMix);return}const q=s.questions[s.index];const item=q.type==='pair-single'?GAME_DATA.couples[q.index]:q.type==='puzzle-single'?{answer:q.title}:GAME_DATA[q.type][q.index];const label=q.type==='pair-single'?'주인공 짝 잇기':q.type==='puzzle-single'?'슬라이딩 퍼즐':GAME_INFO[q.type].label;
if(q.type==='pair-single'){
  const partners=[...new Set(GAME_DATA.couples.filter(x=>x.a===item.a).map(x=>x.b))];
  const multiPartner=partners.length>1;
  const wrong=[...new Set(GAME_DATA.couples.map(x=>x.b).filter(name=>!partners.includes(name)))];
  // One-to-many questions can contain several valid partners; all visible partners must be checked.
  const additional=shuffled(partners.filter(name=>name!==item.b)).slice(0,multiPartner?Math.floor(Math.random()*Math.min(3,partners.length)):0);
  const validChoices=[item.b,...additional];
  const options=shuffled([...validChoices,...shuffled(wrong).slice(0,4-validChoices.length)]);
  const accepted=new Set(options.filter(name=>partners.includes(name)));
  const selected=new Set();

  // Apply the selected appearance directly so legacy glossy button rules cannot mask it.
  const markChoice=(button,checked)=>{
    button.classList.toggle('mix-selected',checked);
    button.setAttribute('aria-pressed',String(checked));
    const style=button.style;
    for(const key of ['background','border','border-bottom','box-shadow','color','text-shadow','outline','outline-offset'])style.removeProperty(key);
    if(checked){
      style.setProperty('background','linear-gradient(180deg,#f1fff3,#bfeacc)','important');
      style.setProperty('border','3px solid #2ea968','important');
      style.setProperty('border-bottom','6px solid #1c804c','important');
      style.setProperty('box-shadow','0 0 0 4px rgba(71,208,119,.48),0 7px 14px rgba(21,113,63,.38),inset 0 2px 0 white','important');
      style.setProperty('color','#145b39','important');
      style.setProperty('text-shadow','none','important');
      style.setProperty('outline','2px solid #7ff0a6','important');
      style.setProperty('outline-offset','1px','important');
    }
  };
  base('🎲 랜덤게임',`<section class="panel"><div class="question-head"><strong>${label}</strong><span class="counter">${s.index+1} / ${s.questions.length}</span></div><p class="question">${esc(item.a)}의 짝은 누구일까요?</p>${multiPartner?'<p class="pair-note">정답이 여러 명일 수 있습니다. 해당하는 이름을 모두 선택하세요.</p>':''}<div class="cards">${options.map((name,i)=>`<button class="outline" type="button" data-opt="${i}" aria-pressed="false">${esc(name)}</button>`).join('')}</div>${multiPartner?'<div class="actions" style="margin-top:14px"><button class="primary" id="pair-check" type="button">선택 완료</button></div>':''}<p id="feedback" class="feedback" role="status" aria-live="polite"></p></section>${footer('mix')}`);
  const buttons=[...document.querySelectorAll('[data-opt]')];
  const finish=()=>{recordCorrect('mix',1,1,questionId('couples',q.index));buttons.forEach(x=>x.disabled=true);const submit=document.getElementById('pair-check');if(submit)submit.disabled=true;const oldIndex=s.index;advanceAfterThreeSeconds(()=>{if(current==='mix'&&mixState===s&&s.index===oldIndex){s.index++;renderMix()}})};
  const feedbackChoice=ok=>{const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'정답입니다!':'틀렸습니다.';if(ok)finish()};
  buttons.forEach(b=>b.onclick=()=>{
    if(multiPartner){const name=options[+b.dataset.opt];if(selected.has(name))selected.delete(name);else selected.add(name);buttons.forEach(x=>{const checked=selected.has(options[+x.dataset.opt]);markChoice(x,checked)});const f=document.getElementById('feedback');f.textContent='';f.className='feedback';}
    else{buttons.forEach(x=>{const checked=x===b;markChoice(x,checked)});feedbackChoice(options[+b.dataset.opt]===item.b)}
  });
  if(multiPartner)document.getElementById('pair-check').onclick=()=>feedbackChoice(selected.size===accepted.size&&[...accepted].every(name=>selected.has(name)));
  bindRestart('mix',newMix);return}

if(q.type==='puzzle-single'){startMixPuzzle(item.answer);return}
const questionIndex=s.index;base('🎲 랜덤게임',`<section class="panel"><div class="question-head"><strong>${GAME_INFO[q.type].emoji} ${label}</strong><span class="counter">${s.index+1} / ${s.questions.length}</span></div>${item.demo?'<p class="sample">※ 예시 문제입니다.</p>':''}${quizText(q.type,item)}<form id="answer-form"><input type="text" id="answer" placeholder="정답 입력" required autocomplete="off" aria-label="정답 입력"><div class="actions"><button class="primary" id="submit">제출</button></div></form><p id="feedback" class="feedback" role="status" aria-live="polite"></p></section>${footer('mix')}`);document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();const ok=(item.answers||[item.answer]).some(x=>normal(x)===normal(document.getElementById('answer').value));const f=document.getElementById('feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'정답입니다!':'틀렸습니다.';if(ok){if(!item.demo)recordCorrect('mix',1,1,questionId(q.type,q.index));document.getElementById('submit').disabled=true;document.getElementById('answer').disabled=true;document.querySelectorAll('.initial').forEach(x=>x.classList.add('good'));advanceAfterThreeSeconds(()=>{if(current!=='mix'||mixState!==s||s.index!==questionIndex)return;s.index++;renderMix()})}else{document.querySelectorAll('.initial').forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')})}};if(q.type==='initials')bindInitialHint(item);bindRestart('mix',newMix)}

let puzzleState=null, puzzleSize=5, puzzleYear='202512', puzzleDemo=false;
const minTitleLength=n=>({5:2,10:5,15:8,20:11})[n];
const puzzleNeighbors=(i,n)=>[i%n>0?i-1:-1,i%n<n-1?i+1:-1,i>=n?i-n:-1,i<n*(n-1)?i+n:-1].filter(x=>x>=0);

function puzzleTokens(title){return Array.from(title).filter(ch=>ch.trim()&&ch!==' ')}
function puzzleMatches(board,word,target){const n=Math.sqrt(board.length);const hits=[];for(let start=0;start<n*n;start++)for(const step of [1,n]){const ix=word.map((_,k)=>start+k*step);if(ix.at(-1)>=n*n||step===1&&Math.floor(start/n)!==Math.floor(ix.at(-1)/n))continue;if(target&&ix.some((v,k)=>v!==target[k]))continue;if(ix.every((v,k)=>board[v]?.kind==='title'&&board[v]?.char===word[k]))hits.push(ix)}return hits}
function puzzleWordPool(){return puzzleForSize(puzzleSize).filter(x=>Array.isArray(x.appearances)&&x.appearances.some(t=>String(t).includes(puzzleYear)))}
function puzzlePick(){const pool=puzzleWordPool();return pool.length?unseenFirst(pool,x=>puzzleSizedId(x.title,puzzleSize))[0].title:null}
function fillerChar(letters){const pool=letters.filter(ch=>/[가-힣]/.test(ch));const syll=pool.length?pool:['가','나','다'];return syll[Math.floor(Math.random()*syll.length)]}
function makePuzzle(word,level,n){
 const letters=puzzleTokens(word);
 if(letters.length>n)throw Error('글자판보다 제목이 깁니다');
 const vertical=Math.random()<.5;
 const row=vertical?Math.floor(Math.random()*(n-letters.length+1)):Math.floor(Math.random()*n);
 const col=vertical?Math.floor(Math.random()*n):Math.floor(Math.random()*(n-letters.length+1));
 const targets=letters.map((_,k)=>(row+(vertical?k:0))*n+col+(vertical?0:k));
 const targetSet=new Set(targets);
 const edges=targets.flatMap(i=>puzzleNeighbors(i,n).filter(j=>!targetSet.has(j)).map(j=>({from:i,to:j})));
 const runs=4;
 const steps=n===5?450:n===10?1500:n===15?3400:6800;
 let best=null,bestScore=-Infinity;
 for(let trial=0;trial<runs;trial++){
  const board=Array.from({length:n*n},()=>({kind:'filler',char:''}));
  targets.forEach((i,k)=>{board[i]={kind:'title',char:letters[k]}});
  const edge=edges[Math.floor(Math.random()*edges.length)];
  let empty=edge.to;board[empty]=null;
  const undo=[];
  let last=-1;
  const move=(pos)=>{const old=empty;board[empty]=board[pos];board[pos]=null;undo.push(old);empty=pos;last=old};
  move(edge.from);
  for(let k=0;k<steps;k++){
   const choices=puzzleNeighbors(empty,n).filter(j=>j!==last);
   const pool=choices.length?choices:puzzleNeighbors(empty,n);
   const pos=pool[Math.floor(Math.random()*pool.length)];
   move(pos);
  }
  const positions=[];
  for(let i=0;i<board.length;i++)if(board[i]?.kind==='title')positions.push(i);
  // 정답선에서의 거리, 제목 타일끼리의 거리, 인접 여부를 함께 평가합니다.
  let offTarget=0,spread=0,adjacent=0;
  for(let a=0;a<positions.length;a++){
   const pos=positions[a],r=Math.floor(pos/n),c=pos%n;
   let nearest=n*2;
   for(const target of targets){const dist=Math.abs(r-Math.floor(target/n))+Math.abs(c-target%n);if(dist<nearest)nearest=dist}
   offTarget+=nearest;
   for(let b=0;b<a;b++){
    const other=positions[b],d=Math.abs(r-Math.floor(other/n))+Math.abs(c-other%n);
    if(d===1)adjacent++;
    spread+=Math.min(d,Math.max(3,Math.floor(n/2)));
   }
  }
  const score=offTarget*5+spread/(positions.length||1)*2-adjacent*14;
  if(score>bestScore){bestScore=score;best={board,empty,undo}}
 }
 return {...best,word:letters,title:word,targets,level:2,n,moves:0,solved:false,titleRevealed:false};
}

 const empty=puzzleSource.length===0;
 base('슬라이딩 퍼즐',`<section class="panel ${n===15?'puzzle-size-15':''}"><div class="question-head"><strong>🧠 제목 슬라이딩 퍼즐</strong></div>${puzzleControls()}<p class="empty-state">${empty?'202512 출현 작품 데이터가 아직 연결되지 않았습니다.':'이 크기에 맞는 202512 출현 작품 제목이 없습니다.'}</p><div class="actions"><button class="outline" id="puzzle-demo">예시로 작동 테스트</button></div><div class="actions"><button class="outline" id="puzzle-import">JSON 불러오기</button><input hidden type="file" id="puzzle-file" accept=".json,application/json"></div><p class="help">202512 출현 이력 JSON을 연결하면 해당 작품에서 무작위로 출제됩니다. 예시 테스트는 실제 출현 작품을 뜻하지 않습니다.</p></section>${footer('puzzle')}`);
 bindPuzzleControls();document.getElementById('puzzle-demo').onclick=()=>{puzzleDemo=true;newPuzzle()};
 const file=document.getElementById('puzzle-file');document.getElementById('puzzle-import').onclick=()=>file.click();file.onchange=async()=>{try{const data=JSON.parse(await file.files[0].text());if(!Array.isArray(data)||!data.every(x=>typeof x.title==='string'&&Array.isArray(x.appearances)))throw Error('형식 오류');puzzleSource=data;puzzleDemo=false;newPuzzle()}catch(e){alert('제목과 appearances 배열을 가진 JSON 목록을 선택해 주세요.')}};bindRestart('puzzle',()=>{puzzleDemo=false;newPuzzle()});
}
function puzzleControls(){const v=puzzleDemo?null:puzzleStageStats(puzzleSize);return `<div class="puzzle-toolbar"><label for="puzzle-size">블록 크기</label><select id="puzzle-size">${PUZZLE_SIZES.map(n=>`<option value="${n}" ${n===puzzleSize?'selected':''}>${n}×${n}</option>`).join('')}</select></div>${v?`<p class="puzzle-progress" aria-live="polite">진행률 ${v.got} / ${v.total} · LV ${levelFor(v.got,v.total)}</p>`:''}`}
function bindPuzzleControls(){const el=document.getElementById('puzzle-size');if(el)el.onchange=e=>{puzzleSize=+e.target.value;newPuzzle()}}
async function newPuzzle(){current='puzzle';puzzleYear='202512';if(!puzzleDemo){try{await ensurePuzzleData()}catch(err){console.error('게임 제목 복호화 실패',err);showPuzzleUnavailable();return}}let word=puzzleDemo?(['시맨틱 에러','유언 때문에 죽는 건 잠깐 미뤘습니다','충격! 머리가 모니터인 남자친구 실존'].find(t=>{let z=puzzleTokens(t).length;return z>=minTitleLength(puzzleSize)&&z<=puzzleSize})||'전마'):puzzlePick();if(!word){puzzleState=null;showPuzzleUnavailable();return}puzzleState=makePuzzle(word,2,puzzleSize);renderPuzzle()}
function startMixPuzzle(word){const size=mixState.difficulty;if(puzzleTokens(word).length>size){mixState.index++;renderMix();return;}puzzleState=makePuzzle(word,2,size);renderPuzzle(true)}
function renderPuzzle(inMix=false){const s=puzzleState,n=s.n,level=s.level;const count=inMix?`${mixState.index+1} / ${mixState.questions.length}`:'';const header=inMix?'🎲 랜덤게임':'슬라이딩 퍼즐';base(header,`<section class="panel"><div class="question-head"><strong>🧠 제목 슬라이딩 퍼즐</strong>${inMix?`<span class="counter" id="move-counter">${count}</span>`:""}</div>${!inMix?puzzleControls():''}${!inMix&&puzzleDemo?'<p class="sample">※ 예시 제목으로 이동을 테스트하는 중입니다.</p>':''}<p class="puzzle-title" id="puzzle-title" aria-live="polite">${s.titleRevealed?`완성할 제목: <b>${esc(s.title)}</b>`:""}</p><div class="puzzle-grid" id="puzzle-grid" style="--puzzle-n:${n};--puzzle-gap:${n>=20?2:n>=15?2:n>=10?5:8}px;--puzzle-font:${n===5?22:n===10?13:n===15?12:8}px;--puzzle-radius:${n>=15?2:6}px">${s.board.map((tile,i)=>`<button type="button" class="tile ${tile===null?'empty chosen':tile.kind==='filler'?'filler':''} ${tile!==null&&puzzleNeighbors(s.empty,n).includes(i)?'movable':''} ${!s.solved&&[2,4].includes(level)&&s.targets.includes(i)?'target':''}" data-tile="${i}" aria-label="${Math.floor(i/n)+1}행 ${i%n+1}열 ${tile===null?'빈칸':tile.char||'글자 없는 블록'}" ${s.solved?'disabled':''}>${tile?.char?esc(tile.char):''}</button>`).join('')}</div><p class="feedback" id="feedback" role="status" aria-live="polite"></p><div class="actions"><button class="outline" id="puzzle-reveal" type="button" ${s.titleRevealed?"disabled":""}>${s.titleRevealed?"제목 확인 완료":"제목 보기"}</button></div>${!inMix?'<div class="actions" id="puzzle-next" hidden><button class="primary next-btn" id="next-puzzle">새로운 퍼즐 풀기</button></div>':''}</section>${footer(inMix?'mix':'puzzle')}`);puzzleChosen=true;puzzleAnimating=false;
app.querySelectorAll('[data-tile]').forEach(btn=>btn.onclick=()=>{
  if(puzzleAnimating||s.solved)return;
  const i=+btn.dataset.tile;
  if(i===s.empty){puzzleChosen=true;document.querySelector(`[data-tile="${i}"]`)?.classList.add('chosen');return}
  if(!puzzleNeighbors(s.empty,n).includes(i)){
    btn.classList.remove('invalid');void btn.offsetWidth;btn.classList.add('invalid');
    setTimeout(()=>btn.classList.remove('invalid'),270);return;
  }
  puzzleChosen=false;puzzleAnimating=true;
  const emptyIndex=s.empty;
  const from=btn.getBoundingClientRect();
  const to=document.querySelector(`[data-tile="${emptyIndex}"]`).getBoundingClientRect();
  btn.style.transform=`translate(${to.left-from.left}px,${to.top-from.top}px)`;
  const blank=document.querySelector(`[data-tile="${emptyIndex}"]`);
  if(blank)blank.style.transform=`translate(${from.left-to.left}px,${from.top-to.top}px)`;
  setTimeout(()=>{
    [s.board[i],s.board[emptyIndex]]=[s.board[emptyIndex],s.board[i]];s.empty=i;s.moves++;
    if(s.undo?.length&&i===s.undo.at(-1)){s.undo.pop()}else{s.undo=[]}
    const hits=puzzleMatches(s.board,s.word,[2,4].includes(level)?s.targets:null);
    if(hits.length){s.solved=true;if(!puzzleDemo)recordCorrect(inMix?'mix':'puzzle',1,1,puzzleSizedId(s.title,n));if(!inMix){updatePuzzleBest(n);recordClear('puzzle',25);}}
    for(const el of document.querySelectorAll('[data-tile]')){el.style.transition='none';el.style.transform='';}
    paintPuzzle(hits.length?hits[0]:null,inMix);
    for(const el of document.querySelectorAll('[data-tile]')){void el.offsetWidth;el.style.transition='';}
    puzzleAnimating=false;
    if(hits.length&&inMix){const snap=mixState;const questionIndex=snap.index;advanceAfterThreeSeconds(()=>{if(current==='mix'&&mixState===snap&&snap.index===questionIndex){snap.index++;renderMix()}})}
  },190);
});if(!inMix)bindPuzzleControls();document.getElementById('puzzle-reveal').onclick=()=>{s.titleRevealed=true;document.getElementById('puzzle-title').innerHTML='완성할 제목: <b>'+esc(s.title)+'</b>';const button=document.getElementById('puzzle-reveal');button.textContent='제목 확인 완료';button.disabled=true};if(!inMix)document.getElementById('next-puzzle').onclick=()=>newPuzzle();bindRestart(inMix?'mix':'puzzle',inMix?newMix:newPuzzle)}
function paintPuzzle(hits,inMix){const s=puzzleState,n=s.n;const moveCounter=document.getElementById('move-counter');if(moveCounter&&inMix)moveCounter.textContent=`${mixState.index+1} / ${mixState.questions.length}`;document.querySelectorAll('[data-tile]').forEach((el,i)=>{const tile=s.board[i];el.textContent=tile?.char||'';el.className='tile'+(tile===null?' empty chosen':tile.kind==='filler'?' filler':'')+(!s.solved&&[2,4].includes(s.level)&&s.targets.includes(i)?' target':'')+(hits?.includes(i)?' solved':'')+(tile!==null&&!s.solved&&puzzleNeighbors(s.empty,n).includes(i)?' movable':'');el.disabled=s.solved;el.setAttribute('aria-label',`${Math.floor(i/n)+1}행 ${i%n+1}열 ${tile===null?'빈칸':tile.char||'글자 없는 블록'}`)});if(hits){document.getElementById('feedback').textContent='정답입니다!';document.getElementById('feedback').className='feedback good';const nextBox=document.getElementById('puzzle-next');if(nextBox&&!inMix)nextBox.hidden=false}}
// URL 경로에 의존하지 않는 완전한 단일 파일
intro();
</script><script>
// Delegated click for excerpt image full-size view; supports quiz and random modes.
document.addEventListener('click', function(event){
  const trigger=event.target.closest?.('.excerpt-image-open');
  if(!trigger)return;
  const image=trigger.querySelector('img');
  if(!image)return;
  const dialog=document.createElement('dialog');
  dialog.className='excerpt-zoom-dialog';
  if((image.alt||'').includes('표지 조각')) dialog.classList.add('cover-zoom-dialog');
  const close=document.createElement('button');
  close.type='button';
  close.className='excerpt-zoom-close';
  close.innerHTML='&times;';
  close.setAttribute('aria-label','이미지 확대 닫기');
  const content=document.createElement('div');
  content.className='excerpt-zoom-content';
  const enlarged=document.createElement('img');
  enlarged.src=image.currentSrc||image.src;
  enlarged.alt=image.alt;
  if(dialog.classList.contains('cover-zoom-dialog')){
    const fitCover=()=>{
      const nativeWidth=enlarged.naturalWidth||image.naturalWidth||0;
      const availableWidth=Math.max(1,dialog.clientWidth-40);
      if(nativeWidth) enlarged.style.width=Math.round(Math.min(nativeWidth*2.3,availableWidth))+'px';
    };
    enlarged.addEventListener('load',fitCover,{once:true});
    if(enlarged.complete) requestAnimationFrame(fitCover);
  }
  content.append(enlarged);
  dialog.append(close,content);
  document.body.append(dialog);
  const dismiss=()=>dialog.close();
  close.addEventListener('click',dismiss);
  dialog.addEventListener('click',e=>{if(e.target===dialog)dismiss()});
  dialog.addEventListener('close',()=>dialog.remove(),{once:true});
  dialog.showModal();
});
</script>
</body></html>
